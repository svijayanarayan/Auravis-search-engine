<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back — AURAVIS</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="auth"><img src="{{url_for('static',filename='auravis-logo.svg')}}" class="auth-logo"><h1>Welcome back</h1>{% with messages=get_flashed_messages() %}{%for m in messages%}<div class="flash">{{m}}</div>{%endfor%}{%endwith%}<form method="post" class="auth-card"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="search-btn">Login</button></form><a href="/register">Create an account</a></main></body></html>
